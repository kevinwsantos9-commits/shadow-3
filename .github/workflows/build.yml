name: Build Shadow Servants

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build NeoForge Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: false

      - name: Verificar Gradle
        run: gradle --version

      - name: Compilar mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Verificar JAR
        run: |
          echo "JARs gerados:"
          ls -lh build/libs/

      - name: Enviar JAR como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowServants-1.21.1-NeoForge-21.1.172
          path: build/libs/*.jar
          if-no-files-found: error
